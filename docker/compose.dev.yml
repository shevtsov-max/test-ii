# Среда разработки: MySQL, бэкенд (Octane + FrankenPHP), очередь, планировщик, Telegram-бот,
# фронтенд (Vite с горячей перезагрузкой) и Mailpit (все письма — в веб-интерфейсе).
# Запуск из корня проекта: docker compose up -d   (см. docker/README.md)
name: rodoslovnaya-dev

x-backend: &backend
  build:
    context: ../backend
    target: dev
  image: rodoslovnaya-backend:dev
  volumes:
    - ../backend:/app
  env_file: ../.env
  environment:
    APP_ENV: local
    DB_HOST: mysql
    DB_PORT: 3306
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
    APP_URL: http://localhost:${FRONTEND_PORT:-5173}
  depends_on:
    mysql:
      condition: service_healthy
  restart: unless-stopped

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
      - ../db/mysql/conf.d:/etc/mysql/conf.d:ro
      - ../db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - 127.0.0.1:${DB_FORWARD_PORT:-3306}:3306
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    <<: *backend
    environment:
      APP_ENV: local
      DB_HOST: mysql
      DB_PORT: 3306
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
      APP_URL: http://localhost:${FRONTEND_PORT:-5173}
      # Основной контейнер ставит зависимости и выполняет миграции
      RUN_MIGRATIONS: "true"
    ports:
      - 127.0.0.1:${BACKEND_PORT:-8000}:8000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 600s

  worker:
    <<: *backend
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=1"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      disable: true

  scheduler:
    <<: *backend
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      disable: true

  bot:
    <<: *backend
    # Без публичного адреса бот получает сообщения опросом. Если токен не задан — просто ждёт.
    command: ["php", "artisan", "telegram:poll"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      disable: true

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      VITE_API_MODE: graphql
      VITE_GRAPHQL_URL: /graphql
      VITE_PROXY_TARGET: http://backend:8000
      VITE_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
    volumes:
      - ../frontend:/app
      # node_modules — в отдельном томе: бинарные пакеты собираются под Linux контейнера
      - frontend_node_modules:/app/node_modules
    ports:
      - ${FRONTEND_PORT:-5173}:5173
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - 127.0.0.1:${MAILPIT_PORT:-8025}:8025
    restart: unless-stopped

volumes:
  mysql:
  frontend_node_modules:
