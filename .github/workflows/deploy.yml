name: Build & deploy to GitHub Pages

# Демо-версия фронтенда в режиме без сервера (данные в браузере): https://shevtsov-max.github.io/test-ii/
# Полная версия с сервером разворачивается через docker/ (см. docs/deploy.md).

on:
  push:
    branches: [main]
    paths-ignore: ['backend/**', 'db/**', 'docker/**', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Ветки-эксперименты, которые публикуются рядом с основным сайтом, через пробел: "путь=ветка".
  # experiment=experiment/inline-branches  →  https://<user>.github.io/<repo>/experiment/
  # Пуш в ветку эксперимента запускает пересборку (см. experiment-dispatch.yml). Пустое значение — без экспериментов.
  EXPERIMENTS: ""

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

      # Сбой сборки эксперимента не должен ломать публикацию основного сайта
      - name: Build experiment branches
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          for pair in $EXPERIMENTS; do
            path="${pair%%=*}"
            branch="${pair#*=}"
            if ! git fetch --depth=1 origin "$branch"; then
              echo "::warning::ветка $branch не найдена — эксперимент $path пропущен"
              continue
            fi
            git worktree add "../../exp-$path" FETCH_HEAD
            # Старые ветки — фронтенд в корне, новые — в frontend/
            dir="../../exp-$path"
            if [ -d "$dir/frontend" ]; then dir="$dir/frontend"; fi
            (cd "$dir" && npm ci && npm run build)
            mkdir -p "dist/$path"
            cp -r "$dir/dist/." "dist/$path/"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
