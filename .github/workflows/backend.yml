# Тесты бэкенда (Laravel): при изменениях в backend/ и схеме API
name: Backend

on:
  push:
    branches: [main]
    paths: ['backend/**', 'docs/api/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'docs/api/**', '.github/workflows/backend.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_mysql, zip, pcntl
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint --test
      - run: php artisan test
      # Схема в docs/api должна совпадать с кодом
      - run: php artisan graphql:print-schema --output=../docs/api/schema.graphql && git diff --exit-code -- ../docs/api/schema.graphql
