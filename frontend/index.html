<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Родословная — семейное древо</title>
    <meta name="description" content="Составляйте родословную: интерактивное древо, персоны, события, места, документы, поколенные росписи. Бесплатно и без интернета." />
    <meta name="theme-color" content="#F6F4F0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Родословная" />
    <meta property="og:title" content="Родословная — семейное древо" />
    <meta property="og:description" content="Интерактивное семейное древо, персоны, события и росписи." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <style>
      /* Сплэш до загрузки приложения */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f6f4f0;
        z-index: 9999;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #boot div {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        color: #6b7280;
        font-size: 14px;
      }
      #boot img {
        width: 56px;
        height: 56px;
        animation: boot 1.2s ease-in-out infinite;
      }
      @keyframes boot {
        50% {
          transform: scale(0.92);
          opacity: 0.7;
        }
      }
      @media (prefers-color-scheme: dark) {
        #boot {
          background: #0f1216;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot"><div><img src="./favicon.svg" alt="" />Родословная</div></div>
    <div id="app"></div>
    <noscript>Для работы «Родословной» включите JavaScript.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
