# Сгенерировано командой `php artisan graphql:print-schema` из backend/app/GraphQL — не редактировать вручную.
# Описание протокола — docs/api/README.md

"Произвольное значение JSON"
scalar JSON

"Миллисекунды Unix"
scalar Timestamp

"Календарь: julian — старый стиль"
enum Calendar {
  gregorian
  julian
}

"Тип дополнительного поля"
enum CustomFieldType {
  text
  number
  date
  url
}

"Точность даты"
enum DateQualifier {
  exact
  about
  estimated
  calculated
  before
  after
  between
}

"Статус передачи ветки"
enum DelegationStatus {
  pending
  active
  cloned
  declined
  revoked
  ended
}

"Тип события жизни"
enum EventType {
  baptism
  education
  occupation
  residence
  military
  award
  emigration
  immigration
  census
  religion
  nationality
  namechange
  illness
  burial
  custom
}

"Отношения пары"
enum FamilyStatus {
  married
  partners
  engaged
  separated
  divorced
  widowed
  unknown
}

"Пол: M — мужской, F — женский, U — неизвестен"
enum Gender {
  M
  F
  U
}

"Вид приглашения: доступ к древу или передача ветки"
enum InvitationKind {
  member
  delegation
}

"Вид файла"
enum MediaKind {
  photo
  document
  audio
  video
  other
}

"Статус участника"
enum MemberStatus {
  pending
  active
}

"Тип места"
enum PlaceType {
  country
  region
  district
  city
  village
  address
  church
  cemetery
  other
}

"Кому видна запись"
enum Privacy {
  public
  family
  private
}

"Тип источника"
enum SourceType {
  metric
  revision
  census
  archive
  document
  book
  website
  oral
  other
}

"Роль в древе"
enum TreeRole {
  owner
  editor
  viewer
}

"Вид памятной даты"
enum UpcomingEventKind {
  birthday
  wedding
  memory_birth
  memory_death
}

"Принятое приглашение"
type AcceptInvitationResult {
  kind: InvitationKind!

  "Древо, которое теперь доступно"
  treeId: ID!
}

"Токены и пользователь"
type AuthPayload {
  accessToken: String!
  refreshToken: String!
  user: User!
}

"Ссылка на источник"
type Citation {
  id: ID!
  sourceId: ID!

  "Лист, страница, запись"
  page: String!

  "3 — прямое свидетельство … 0 — ненадёжное"
  quality: Int!

  note: String!
}

"Род — ветвь фамилии"
type Clan {
  id: ID!
  name: String!
  color: String!
  description: String!
}

"Созданная передача и ссылка для отправки"
type CreateDelegationResult {
  delegation: Delegation!
  link: String!
}

"Дополнительное поле древа"
type CustomFieldDef {
  id: ID!
  label: String!
  type: CustomFieldType!
}

"Смерть: дата, место, причина"
type DeathPoint {
  date: GDate!
  placeId: ID
  citations: [Citation!]!
  cause: String!
}

"Актуальная ветка из древа родственника (только просмотр)"
type DelegatedBranch {
  delegation: Delegation!

  "TreeData ветки: persons, families, places, media, sources, clans — словари по id"
  data: JSON!
}

"Передача ветки родственнику"
type Delegation {
  id: ID!
  status: DelegationStatus!
  rootPersonId: ID!

  "Персоны, закрытые для правки (после принятия)"
  personIds: [ID!]!

  "Видит только владелец древа"
  email: String

  message: String

  "Ссылка-приглашение (пока не принято)"
  link: String

  "Кто продолжает ветку"
  delegateName: String

  targetTreeId: ID
  createdAt: Timestamp!
  acceptedAt: Timestamp
}

"Семья: пара (или один родитель) и дети"
type Family {
  id: ID!

  "0–2 партнёра"
  partners: [ID!]!

  status: FamilyStatus!
  marriage: LifePoint!
  divorce: LifePoint!
  children: [ID!]!

  "{ [childId]: adopted | foster | step | guardian | unknown } — неродные дети"
  childLinks: JSON!

  note: String!
  citations: [Citation!]!
}

"Дата с точностью: «около 1850», «между 1880 и 1885», старый стиль"
type GDate {
  qualifier: DateQualifier!
  day: Int
  month: Int
  year: Int

  "Вторая граница для between"
  day2: Int

  month2: Int
  year2: Int

  "julian — старый стиль"
  calendar: Calendar

  "Исходный текст, если дату не удалось разобрать"
  text: String
}

"Приглашение по ссылке: в древо или продолжить ветку"
type Invitation {
  kind: InvitationKind!

  "pending — можно принять"
  status: String!

  expired: Boolean!
  treeName: String!
  inviterName: String!

  "Для приглашения в древо"
  role: TreeRole

  "С кого начинается ветка"
  rootName: String

  "Сколько человек в ветке"
  persons: Int

  "Кому отправлено (частично скрыто)"
  email: String

  "Сообщение от пригласившего"
  message: String
}

"Событие жизни"
type LifeEvent {
  id: ID!
  type: EventType!

  "Название для type = custom"
  title: String!

  date: GDate!
  placeId: ID
  description: String!
  citations: [Citation!]!
}

"Дата, место и источники факта"
type LifePoint {
  date: GDate!
  placeId: ID
  citations: [Citation!]!
}

"Фото или документ"
type Media {
  id: ID!
  kind: MediaKind!
  title: String!
  description: String!
  date: GDate!
  placeId: ID
  personIds: [ID!]!
  sourceId: ID
  src: String
  thumb: String
  mime: String!
  size: Int!
  createdAt: Timestamp!
}

"Уведомления о памятных датах"
type NotificationSettings {
  "Бот Telegram настроен на сервере"
  available: Boolean!

  botUsername: String
  telegramLinked: Boolean!
  telegramUsername: String
  enabled: Boolean!

  "«ЧЧ:ММ» по местному времени"
  sendTime: String!

  timezone: String!
  birthdays: Boolean!

  "Годовщины свадеб"
  anniversaries: Boolean!

  "Дни памяти умерших"
  memorials: Boolean!
}

"Персона древа"
type Person {
  id: ID!
  gender: Gender!
  firstName: String!
  middleName: String!
  lastName: String!

  "Фамилия при рождении"
  birthName: String!

  nickname: String!

  "Титул, звание"
  title: String!

  "«II», «старший»"
  suffix: String!

  clanId: ID
  living: Boolean!
  birth: LifePoint!
  death: DeathPoint!
  residencePlaceId: ID
  occupation: String!
  email: String!
  phone: String!

  "Главное фото (id записи Media)"
  avatarId: ID

  note: String!
  biography: String!
  events: [LifeEvent!]!

  "Значения дополнительных полей: { [CustomFieldDef.id]: string }"
  custom: JSON!

  citations: [Citation!]!
  favorite: Boolean!
  privacy: Privacy!
  createdAt: Timestamp!
  updatedAt: Timestamp!
}

"Место (иерархия: страна → регион → город)"
type Place {
  id: ID!
  name: String!
  type: PlaceType!
  parentId: ID
  lat: Float
  lng: Float
  altNames: String!
  note: String!
}

"Результат сохранения древа"
type SaveResult {
  version: Float!
  updatedAt: Timestamp!
}

"Источник: метрическая книга, архивное дело, публикация"
type Source {
  id: ID!
  title: String!
  type: SourceType!
  author: String!

  "Архив, библиотека"
  repository: String!

  "Фонд, опись, дело"
  callNumber: String!

  url: String!
  date: GDate!
  note: String!
}

"Ссылка для привязки Telegram"
type TelegramLink {
  url: String!
  expiresAt: Timestamp!
}

"Участник древа"
type TreeMember {
  id: ID!
  role: TreeRole!

  "null, пока приглашение не принято"
  user: User

  invitedEmail: String
  status: MemberStatus!
  createdAt: Timestamp!
}

"Карточка древа для списка «Мои древа»"
type TreeSummary {
  id: ID!
  name: String!
  description: String!
  persons: Int!
  families: Int!
  media: Int!
  homeName: String
  homeThumb: String
  homeGender: Gender
  role: TreeRole!
  createdAt: Timestamp!
  updatedAt: Timestamp!
}

"Древо целиком"
type Tree {
  id: ID!
  name: String!
  description: String!

  "«Это Вы»"
  homePersonId: ID

  "Передаётся в applyTreeChanges как baseVersion"
  version: Float!

  role: TreeRole!
  createdAt: Timestamp!
  updatedAt: Timestamp!
  customFields: [CustomFieldDef!]!
  persons: [Person!]!
  families: [Family!]!
  places: [Place!]!
  media: [Media!]!
  sources: [Source!]!
  clans: [Clan!]!
}

"Ближайшая памятная дата"
type UpcomingEvent {
  kind: UpcomingEventKind!

  "YYYY-MM-DD"
  date: String!

  inDays: Int!
  years: Int
  treeId: ID!
  treeName: String!
  personIds: [ID!]!
  names: [String!]!
}

"Подписанная ссылка для загрузки файла"
type Upload {
  "PUT сюда тело файла"
  uploadUrl: String!

  "Адрес файла после загрузки"
  fileUrl: String!

  thumbUrl: String

  "Дополнительные заголовки PUT"
  headers: JSON
}

"Пользователь"
type User {
  id: ID!
  email: String!
  name: String!
  avatar: String
  emailVerified: Boolean!

  "Согласие на рассылку новостей"
  marketingOptIn: Boolean!

  "Обязательные документы, новую редакцию которых нужно принять"
  pendingConsents: [String!]!

  createdAt: Timestamp!
}

"Согласие с документом определённой редакции"
input ConsentInput {
  "terms, privacy, personal_data, marketing"
  document: String!
  version: String!
}

"Новое древо"
input CreateTreeInput {
  name: String!
  description: String

  "TreeData (импорт, пример, мастер «Новое древо»)"
  data: JSON
}

"Настройки уведомлений"
input NotificationSettingsInput {
  enabled: Boolean

  "«ЧЧ:ММ»"
  sendTime: String

  "Например, Europe/Moscow"
  timezone: String
  birthdays: Boolean
  anniversaries: Boolean
  memorials: Boolean
}

"Изменение профиля"
input ProfileInput {
  name: String

  "Смена почты снимает отметку о подтверждении"
  email: String

  "data:-изображение; null — удалить"
  avatar: String

  "Согласие на информационные сообщения (дать или отозвать)"
  marketingOptIn: Boolean
}

"Регистрация"
input RegisterInput {
  name: String!
  email: String!

  "Не короче 8 символов, буквы и цифры"
  password: String!

  "Принятые документы"
  consents: [ConsentInput!]!
}

"Изменения древа: только изменённые сущности"
input TreeChangesInput {
  "Версия, от которой клиент вносил изменения"
  baseVersion: Float
  tree: TreeInfoInput

  "Полная замена содержимого (импорт)"
  replace: JSON
  upsertPersons: [JSON!]
  deletePersons: [ID!]
  upsertFamilies: [JSON!]
  deleteFamilies: [ID!]
  upsertPlaces: [JSON!]
  deletePlaces: [ID!]
  upsertMedia: [JSON!]
  deleteMedia: [ID!]
  upsertSources: [JSON!]
  deleteSources: [ID!]
  upsertClans: [JSON!]
  deleteClans: [ID!]
}

"Сведения о древе"
input TreeInfoInput {
  name: String
  description: String
  homePersonId: ID
  customFields: JSON
}

type Query {
  "Ветки из древ родственников (только просмотр)"
  delegatedBranches(treeId: ID!): [DelegatedBranch!]!

  "Ветки древа, переданные родственникам"
  delegations(treeId: ID!): [Delegation!]!

  "Сведения о приглашении по токену из ссылки"
  invitation(token: String!): Invitation

  "Текущий пользователь или null"
  me: User

  "Настройки уведомлений о памятных датах"
  notificationSettings: NotificationSettings!

  "Владелец и участники древа"
  treeMembers(treeId: ID!): [TreeMember!]!

  "Древо целиком"
  tree(id: ID!): Tree

  "Мои древа и древа, к которым открыт доступ"
  trees: [TreeSummary!]!

  "Дни рождения и памятные даты по всем древам"
  upcomingEvents(
    days: Int = 7

    "Часовой пояс пользователя, например Europe/Moscow"
    timezone: String
  ): [UpcomingEvent!]!
}

type Mutation {
  "Принять документы в текущей редакции"
  acceptDocuments(consents: [ConsentInput!]!): User!

  "Принять приглашение"
  acceptInvitation(token: String!): AcceptInvitationResult!

  "Сохранить изменения древа"
  applyTreeChanges(treeId: ID!, changes: TreeChangesInput!): SaveResult!

  "Сменить пароль"
  changePassword(current: String!, next: String!): Boolean!

  "Склонировать переданную ветку в своё древо"
  cloneDelegation(id: ID!): SaveResult!

  "Передать ветку родственнику"
  createDelegation(
    treeId: ID!
    rootPersonId: ID!

    "Если указана — отправим письмо"
    email: String

    message: String
  ): CreateDelegationResult!

  "Ссылка для подключения Telegram"
  createTelegramLink: TelegramLink!

  "Создать древо"
  createTree(input: CreateTreeInput!): TreeSummary!

  "Получить ссылку для загрузки файла в древо"
  createUpload(treeId: ID!, filename: String!, mime: String!, size: Int!): Upload!

  "Отклонить приглашение"
  declineInvitation(token: String!): Boolean!

  "Удалить учётную запись и все древа"
  deleteAccount(password: String!): Boolean!

  "Удалить древо безвозвратно"
  deleteTree(id: ID!): Boolean!

  "Отвязать Telegram"
  disconnectTelegram: NotificationSettings!

  "Пригласить в древо по почте"
  inviteMember(treeId: ID!, email: String!, role: TreeRole!): TreeMember!

  "Вход по почте и паролю"
  login(email: String!, password: String!): AuthPayload!

  "Выйти на этом устройстве"
  logout(refreshToken: String): Boolean!

  "Обновить токены"
  refreshToken(refreshToken: String!): AuthPayload!

  "Создать учётную запись"
  register(input: RegisterInput!): AuthPayload!

  "Закрыть доступ к древу"
  removeMember(memberId: ID!): Boolean!

  "Отправить ссылку для нового пароля"
  requestPasswordReset(email: String!): Boolean!

  "Отправить письмо подтверждения ещё раз"
  resendVerificationEmail: Boolean!

  "Задать новый пароль по ссылке из письма"
  resetPassword(token: String!, password: String!): AuthPayload!

  "Отозвать непринятое приглашение продолжить ветку"
  revokeDelegation(id: ID!): Delegation!

  "Отправить пробное уведомление"
  sendTestNotification: Boolean!

  "Изменить роль участника"
  updateMember(memberId: ID!, role: TreeRole!): TreeMember!

  "Изменить настройки уведомлений"
  updateNotificationSettings(input: NotificationSettingsInput!): NotificationSettings!

  "Изменить имя, почту, фото или согласие на рассылку"
  updateProfile(input: ProfileInput!): User!

  "Подтвердить почту по ссылке из письма"
  verifyEmail(token: String!): Boolean!
}
